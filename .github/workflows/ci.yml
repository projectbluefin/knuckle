name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'feat/**']
  merge_group:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + test (-race)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: go mod tidy (must be clean)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: gofmt (must be clean)
        run: |
          out=$(gofmt -l .)
          if [[ -n "$out" ]]; then
            echo "::error::these files are not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test -race
        run: go test -race ./...

      - name: flaky test detection
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Running tests 5x to detect flaky tests..."
          flaky_detected=0
          for i in {1..5}; do
            echo "Run $i/5..."
            if ! go test -count=1 ./... > /tmp/test_run_$i.log 2>&1; then
              echo "FAIL: Run $i failed"
              flaky_detected=1
              tail -20 /tmp/test_run_$i.log
            fi
          done
          if [[ $flaky_detected -eq 1 ]]; then
            echo "::warning::Potential flaky tests detected — some runs failed. Check logs above."
            exit 1  # Fail CI so flaky tests are not silently ignored
          fi
          echo "✓ All 5 runs passed — no flaky tests detected"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: scripts

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: scan
        run: $(go env GOPATH)/bin/govulncheck ./...

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just-action
      - name: install just (fallback if setup-just action fails)
        if: steps.setup-just-action.outcome == 'failure'
        run: |
          JUST_VERSION=1.58.0
          JUST_SHA256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          curl -fsSL -o /tmp/just.tar.gz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          rm /tmp/just.tar.gz

      - name: per-package coverage thresholds
        run: just cover-check

      - name: aggregate coverage profile
        run: go test -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: coverage-profile
          path: cover.out
          retention-days: 14

      - name: upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./cover.out
          fail_ci_if_error: false

  headless-e2e:
    name: headless e2e (dry-run)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just-action-e2e
      - name: install just (fallback if setup-just action fails)
        if: steps.setup-just-action-e2e.outcome == 'failure'
        run: |
          JUST_VERSION=1.58.0
          JUST_SHA256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          curl -fsSL -o /tmp/just.tar.gz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          rm /tmp/just.tar.gz

      - name: headless dry-run
        run: just headless-test

      - name: iso-smoke recipe dry-run
        run: just --dry-run iso-smoke output/knuckle-installer-stable-amd64.iso /usr/share/OVMF/OVMF_CODE_4M.fd

  iso-boot-smoke:
    name: headless ISO boot smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just-action-iso
      - name: install just (fallback if setup-just action fails)
        if: steps.setup-just-action-iso.outcome == 'failure'
        run: |
          JUST_VERSION=1.58.0
          JUST_SHA256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          curl -fsSL -o /tmp/just.tar.gz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          rm /tmp/just.tar.gz

      - name: build knuckle binary (amd64)
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -ldflags="-s -w" \
            -o knuckle-linux-amd64 ./cmd/knuckle

      - name: install ISO build dependencies
        run: sudo apt-get update && sudo apt-get install -y xorriso mtools cpio systemd-boot-efi

      - name: build installer ISO (amd64, stable)
        run: |
          chmod +x ./scripts/build-iso.sh
          ./scripts/build-iso.sh --channel stable --arch amd64 \
            --binary ./knuckle-linux-amd64

      - name: install QEMU + OVMF
        run: sudo apt-get install -y qemu-system-x86 ovmf

      - name: enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: run headless ISO boot smoke test
        run: |
          just iso-smoke \
            output/knuckle-installer-stable-amd64.iso \
            /usr/share/OVMF/OVMF_CODE_4M.fd \
            120

      - name: upload serial log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: iso-smoke-serial-log
          path: .vm/iso-smoke-serial.log
          retention-days: 7

  cross-compile-arm64:
    name: cross-compile arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: build arm64
        run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...

  bats:
    name: CI/bats script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update -qq && sudo apt-get install -y bats
      - name: Run BATS tests
        run: bats scripts/tests/*.bats
      - name: File issue on main BATS failure
        if: failure() && github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha7 = context.sha.slice(0, 7);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 BATS smoke failure on main (${sha7})`,
              body: [
                `BATS script tests failed on \`main\` after merging commit ${context.sha}.`,
                ``,
                `**Run:** ${runUrl}`,
                `**Commit:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`,
                ``,
                `Check the failing run linked above for the specific test output.`,
                `Fix the failure and close this issue with a reference to the fixing PR.`,
              ].join('\n'),
              labels: ['domain:ci', 'kind/test', 'priority:p0'],
            });
