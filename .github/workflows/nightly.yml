name: Nightly Tests

on:
  schedule:
    # Run daily at 03:00 UTC to catch regressions from dep updates
    - cron: "0 3 * * *"
  workflow_dispatch: # allow manual triggers for debugging

permissions:
  contents: read

jobs:
  nightly-test:
    name: nightly test (-race, 10x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: extended flaky detection (10 iterations)
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          echo "Running tests 10x with -race to detect flaky tests..."
          failures=0
          for i in {1..10}; do
            echo "::group::Run $i/10"
            if ! go test -race -count=1 ./... 2>&1; then
              echo "::endgroup::"
              echo "::error::Run $i FAILED"
              failures=$((failures + 1))
            else
              echo "::endgroup::"
            fi
          done
          if [[ $failures -gt 0 ]]; then
            echo "::error::$failures/10 runs failed — flaky or regressed tests detected"
            exit 1
          fi
          echo "✓ All 10 runs passed"

  nightly-coverage:
    name: nightly coverage snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        continue-on-error: true
        id: setup-just-action
      - name: install just (fallback)
        if: steps.setup-just-action.outcome == 'failure'
        run: |
          JUST_VERSION=1.58.0
          JUST_SHA256=4a5cc2f53e6f0f8c59092a6cc38291eb729d46a7dd95d3ae582008881b84931d
          curl -fsSL -o /tmp/just.tar.gz "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${JUST_SHA256}  /tmp/just.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/just.tar.gz -C /usr/local/bin just
          rm /tmp/just.tar.gz

      - name: per-package coverage gate
        run: just cover-check

      - name: aggregate coverage profile
        run: go test -count=1 -covermode=atomic -coverprofile=cover.out ./...

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nightly-coverage-${{ github.run_number }}
          path: cover.out
          retention-days: 30

      - name: upload to Codecov (nightly flag)
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          files: ./cover.out
          flags: nightly
          fail_ci_if_error: false

  nightly-vuln:
    name: nightly govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"

      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: scan for new advisories
        run: $(go env GOPATH)/bin/govulncheck ./...

  nightly-integration:
    name: nightly integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.6"
          check-latest: true

      - name: run integration tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go test -race -count=1 -v -tags=integration ./...

  notify-failure:
    name: notify on failure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [nightly-test, nightly-coverage, nightly-vuln, nightly-integration]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: file or update nightly failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = "[nightly] Workflow failure";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `The nightly workflow failed on \`${context.sha.slice(0, 7)}\`.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Commit:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}`,
              ``,
              `Check the failing run linked above for the specific job(s) and output.`,
            ].join("\n");

            // Dedupe: reuse an already-open nightly-failure issue instead of
            // filing a new one every day the nightly stays red.
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "ci",
            });
            const openIssue = existing.find((issue) => issue.title === title);

            if (openIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: openIssue.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["ci"],
              });
            }
